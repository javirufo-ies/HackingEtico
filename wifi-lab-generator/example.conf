# ==============================================================================
# Configuración de laboratorio Wi-Fi para lab_generator.py
#
#   Genera el script de despliegue con:
#       ./lab_generator.py lab.conf.example -o despliegue.sh
#
#   Líneas de red:   ssid, tipo, clientes [, canal]
#   Directivas:      clave = valor
#   Comentarios:     empiezan por '#'
#   Separadores:     coma o espacios, indistintamente
# ==============================================================================

# --- Directivas globales ------------------------------------------------------

# Diccionario del que se eligen las claves (aleatorias en cada despliegue).
# Se puede sobrescribir al desplegar:  sudo ./despliegue.sh /otro/dicc.txt
dict = /usr/share/wordlists/rockyou.txt

# Número de interfaces de ataque para el alumno (wlan0..wlanN-1). Por defecto 7.
student_ifaces = 7


# --- Redes --------------------------------------------------------------------
# tipos disponibles:
#   open        red abierta, tráfico HTTP en claro
#   wpa2        WPA2-PSK, handshake 4-way
#   pmkid       WPA2-PSK con clientes, PMKID + handshake   (hostapd parcheado)
#   pmkid_nc    WPA2-PSK sin clientes (clientless)          (hostapd parcheado)
#   enterprise  WPA2-EAP (PEAP/MSCHAPv2)
#   wep         WEP-104, IVs + reinyección ARP
#   wps         WPS con PIN vulnerable                      (hostapd parcheado)
#   wpa3        WPA3-SAE puro, diccionario online
#   wpa3_tm     WPA3 en modo transición (WPA2/WPA3 mixto)
#   wpa3_dg     WPA3 con downgrade de cliente (Dragonblood)
#
# La columna 'clientes' se ignora en pmkid_nc (0), wpa3_tm (2) y wpa3_dg (1),
# que tienen un número de clientes fijo por el propio escenario.
#
# CANAL y BANDA: la banda se deduce del número de canal.
#   2,4 GHz : 1-13                (hw_mode=g)
#   5 GHz   : 36 40 44 48 149 153 157 161 165   (no-DFS, arranque instantáneo)
#             52 56 60 64 100 ... 140 144       (DFS: el AP hace CAC ~1 min
#                                                antes de emitir; se avisa)
# El alumno tendrá que elegir la banda al atacar:
#   airodump-ng --band a   wlan0mon   # solo 5 GHz
#   airodump-ng --band abg wlan0mon   # todo

# ssid            tipo        clientes  canal(opcional)
he_abierta        open        2
wpa2_casa         wpa2        2
pmkid_oficina     pmkid       1         11
pmkid_vacia       pmkid_nc    0         4
corporativa       enterprise  1         3
router_viejo      wep         2         9
router_wps        wps         1         6
wifi_moderna      wpa3        1         36    # WPA3 en 5 GHz (no-DFS)

# Ejemplos adicionales:
# invitados_6     open        1         6     # canal compartido -> filtrar por BSSID
# oficina_5g      wpa2        1         149   # 5 GHz no-DFS
# radar_lab       wpa2        1         52    # 5 GHz DFS (tardará ~1 min)
